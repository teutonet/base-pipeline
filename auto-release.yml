create-release:
  image:
    name: registry-gitlab.teuto.net/4teuto/dev/base-pipeline/release-tools:latest
    entrypoint: [""]
  when: manual
  stage: deploy
  variables:
    GIT_STRATEGY: clone # clone entire repo instead of reusing workspace
    GIT_DEPTH: 0 # avoid shallow clone to give cliff all the info it needs
  script:
    # check for given VERSION, if not provided increase patch version by 1
    - |
      if [ -z $VERSION ]; then
        # get latest release
        json_data=$(wget -O - --header="JOB-TOKEN: ${CI_JOB_TOKEN}" "https://gitlab.teuto.net/api/v4/projects/${CI_PROJECT_ID}/releases/permalink/latest")
        # get latest tag name from json
        current_version_string=$(echo "$json_data" | grep -o "\"tag_name\": *\"[^\"]*" | cut -d"\"" -f4)
        echo "current version $current_version_string"
        # remove "v" from version
        current_version=$(echo "$current_version_string" | sed 's/v//')
        # increase patch version by 1
        new_version=$(echo $current_version | awk -F. -v OFS=. '{$NF += 1 ; print}')
        # readd "v" to version
        new_version_string="v$new_version"
        VERSION=$new_version_string
      fi
    - echo "new version $VERSION"
    # generate changelog with git-cliff
    - CHANGELOG=$(git-cliff -r . --tag ${VERSION})
    # create release with release-cli because ci-keywords cant use env vars from script
    - release-cli --server-url https://$CI_SERVER_HOST --job-token=$CI_JOB_TOKEN --project-id $CI_PROJECT_ID create --name "Release ${VERSION}" --tag-name ${VERSION} --ref $CI_COMMIT_SHA --description "$CHANGELOG"
  only:
    refs:
      - main