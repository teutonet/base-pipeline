include:
  - 'auto-release.yml'
  - 'build-scan-push.yml'
  - 'workflow-rules.yml'

stages:
  - build
  - test
  - deploy

.build:
  parallel:
    matrix:
      - IMAGE_NAME:
        - release-tools
        - kaniko-trivy
      - IMAGE_NAME: base-pipeline
        IMAGE_DIR: "."
# ensure that we can build ourselves with the new kaniko-trivy image
self-test:
  extends: build-scan-push
  stage: test
  needs:
    - build-scan-push
  image:
    name: $CI_REGISTRY_IMAGE/kaniko-trivy:$CI_COMMIT_SHA
    entrypoint: [""]
