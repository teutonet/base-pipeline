variables:
  KUBE_NAMESPACE_FEATURE: $CI_PROJECT_ID-$CI_ENVIRONMENT_SLUG-$CI_MERGE_REQUEST_IID
  KUBE_NAMESPACE_STAGING: $CI_PROJECT_NAME
  KUBE_NAMESPACE_PRODUCTION: $CI_PROJECT_NAME
  CHART_PATH: charts/$CI_PROJECT_NAME

.deployment-base:
  stage: deploy
  image: tickets.teuto.net:5050/teuto-public/base-pipeline/base-pipeline:latest
  variables:
    SHELL: /bin/bash
    VERSION: $CI_COMMIT_SHA
    RELEASE_NAME: $CI_ENVIRONMENT_NAME
  script:
    - &deploy_functions |
      setup_gpg_agent () {
        # check for GPG private key
        if [ -z "$GPG_PRIV_KEY" ]; then
          echo "no GPG_PRIV_KEY given!!!"
        else
          gpg --import <(echo "$GPG_PRIV_KEY" | tr -d '\r')
        fi
        # start GPG agent
        eval $(gpg-agent --daemon -s)
      }
      install_upgrade_helm_release_and_wait () {
        helm dependency update $CHART_PATH
        helm upgrade --install -n $KUBE_NAMESPACE $RELEASE_NAME $CHART_PATH --wait \
          $HELM_ARGS $(for v in $HELM_VERSION_ARGS; do echo --set "$v=$VERSION"; done)
        echo "waiting for helm releases"
        while kubectl get hr -n $KUBE_NAMESPACE -o json | jq -r '.items.[] | select(.status.conditions | any(.status != "True")) | .metadata.name' | grep '^'
        do
          sleep 5
        done
        echo "waiting for pods"
        # pods from jobs can fail, as long as the job itself succeeds
        while kubectl get pod -n $KUBE_NAMESPACE -o json | jq -r '.items.[] | select((.metadata.ownerReferences | all(.kind != "Job")) and (.status.containerStatuses | any(.ready | not))) | .metadata.name' | grep '^'
        do
          sleep 5
        done
        echo "waiting for jobs"
        while kubectl get jobs -n $KUBE_NAMESPACE -o json | jq -r '.items.[] | select(.status.succeeded != 1) | .metadata.name' | grep '^'
        do
          sleep 5
        done
      }
    - |
      setup_gpg_agent
      install_upgrade_helm_release_and_wait
  after_script:
    - &print_url echo $CI_ENVIRONMENT_URL
  timeout: 20 minutes
  interruptible: false

deployment:start:feature:
  extends: .deployment-base
  variables:
    KUBE_NAMESPACE: $KUBE_NAMESPACE_FEATURE
    INGRESS_BASE_URL: $CI_COMMIT_REF_SLUG.$CI_PROJECT_NAME.dev.teuto.dev
    PERFORM_UPGRADE_TEST: "1"
    RELEASE_NAME: "feature"
  before_script:
    - kubectl create namespace $KUBE_NAMESPACE || true
  script:
    - *deploy_functions
    - |
      setup_gpg_agent
      if [ "$PERFORM_UPGRADE_TEST" -eq 1 ]; then
        git config --global --add safe.directory $CI_PROJECT_DIR
        git fetch origin $CI_MERGE_REQUEST_DIFF_BASE_SHA
        git worktree add .git/worktree/merge-base $CI_MERGE_REQUEST_DIFF_BASE_SHA
        cd .git/worktree/merge-base
        export VERSION=$CI_DEFAULT_BRANCH-$CI_MERGE_REQUEST_DIFF_BASE_SHA
        echo "rolling out main branch deployment: $VERSION"
        install_upgrade_helm_release_and_wait
        cd -
        export VERSION=$CI_COMMIT_SHA
        echo "main branch rolled out, upgrading with feature deployment: $VERSION"
      else
        export VERSION=$CI_COMMIT_SHA
        echo "installing with feature deployment: $VERSION"
      fi
      install_upgrade_helm_release_and_wait
  except:
    refs:
      - tags
      - main
  environment:
    name: $CI_COMMIT_REF_NAME
    url: https://$INGRESS_BASE_URL
    on_stop: "deployment:stop-manual:feature"

deployment:start:staging:
  extends: .deployment-base
  variables:
    KUBE_NAMESPACE: $KUBE_NAMESPACE_STAGING
    INGRESS_BASE_URL: $CI_PROJECT_NAME.stg.teuto.dev
    VERSION: main-$CI_COMMIT_SHA
  only:
    refs:
      - main
  environment:
    name: staging
    url: https://$INGRESS_BASE_URL
    on_stop: "deployment:stop-manual:staging"

deployment:start:prod:
  extends: .deployment-base
  variables:
    KUBE_NAMESPACE: $KUBE_NAMESPACE_PRODUCTION
    VERSION: $CI_COMMIT_TAG
  only:
    refs:
      - tags
  environment:
    name: production
    url: https://$INGRESS_BASE_URL
    on_stop: "deployment:stop-manual:production"

.deployment-base:stop:
  image: tickets.teuto.net:5050/teuto-public/base-pipeline/base-pipeline:latest
  stage: deploy-stop
  variables:
    RELEASE_NAME: $CI_ENVIRONMENT_NAME
  interruptible: false
  script:
    - helm uninstall -n $KUBE_NAMESPACE $RELEASE_NAME --wait

.deployment-base:stop-manual: &stop_manual
  extends: .deployment-base:stop
  needs: []
  when: manual

deployment:stop:feature:
  extends: .deployment-base:stop
  variables:
    KUBE_NAMESPACE: $KUBE_NAMESPACE_FEATURE
    RELEASE_NAME: "feature"
  after_script:
    - kubectl delete namespace $KUBE_NAMESPACE --wait=false
  when: always
  allow_failure: true
  except:
    refs:
      - tags
      - main
  environment:
    name: $CI_COMMIT_REF_NAME
    action: stop

deployment:stop-manual:feature:
  <<: *stop_manual
  extends: deployment:stop:feature
  allow_failure: true

deployment:stop-manual:staging:
  <<: *stop_manual
  variables:
    KUBE_NAMESPACE: $KUBE_NAMESPACE_STAGING
  only:
    refs:
      - main
  environment:
    name: staging
    action: stop

deployment:stop-manual:production:
  <<: *stop_manual
  variables:
    KUBE_NAMESPACE: $KUBE_NAMESPACE_PRODUCTION
  before_script: '[[ "$CONFIRMATION" == "YES-I-WANT-TO-DESTROY-PRODUCTION!" ]]'
  only:
    refs:
      - tags
  environment:
    name: production
    action: stop

