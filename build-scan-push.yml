.default_rules: &default_rules
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    variables:
      EXTRA_TAGS: $CI_DEFAULT_BRANCH-$CI_COMMIT_SHA latest
  - if: $CI_COMMIT_TAG
    variables:
      EXTRA_TAGS: $CI_COMMIT_TAG
  - when: on_success

.build:
  stage: build
  parallel:
    matrix:
      - IMAGE_DIR:
          - $CI_PROJECT_DIR
        IMAGE_NAME:
          - $CI_PROJECT_NAME

fetch-version:
  image: ${REGISTRY_MIRROR}bitnami/git:2.42.0-debian-11-r41
  stage: build
  variables:
    GIT_DEPTH: "0"
  script:
    - echo IMAGE_BUILD_VERSION="`git describe --tags --abbrev=0`" > version-var.env
  artifacts:
    reports:
      dotenv: version-var.env
  rules:
    - *default_rules

build-scan-push:
  extends: .build
  image:
    name: registry-gitlab.teuto.net/4teuto/dev/base-pipeline/kaniko-trivy:latest
    entrypoint: [""]
  cache:
    paths: [.cache/trivy]
    key: vulndb
  needs:
    - fetch-version
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        EXTRA_TAGS="$CI_DEFAULT_BRANCH-$CI_COMMIT_SHA latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        EXTRA_TAGS="$CI_COMMIT_TAG"
      fi
    # step 1: build the image
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - |
      destination_args="--tar-path=$IMAGE_NAME${VARIANT+-$VARIANT}.tar"
      for tag in $CI_COMMIT_SHA $EXTRA_TAGS
      do
        destination_args="$destination_args --destination $CI_REGISTRY_IMAGE/$IMAGE_NAME${VARIANT+-$VARIANT}:$tag"
      done

      if [ -z "$IMAGE_DIR" ] && [ "$IMAGE_NAME" != "$CI_PROJECT_NAME" ]; then
        IMAGE_DIR=$IMAGE_NAME
      fi

      BUILD_CONTEXT=${IMAGE_DIR}

    - echo "build image with name '$IMAGE_NAME' in directory '$BUILD_CONTEXT'"

    - |
      /kaniko/executor \
        --registry-mirror mirror.gcr.io \
        --context "${BUILD_CONTEXT}" \
        `# '--dockerfile' must be set because kaniko only uses the dockerfile from '--context' if none exists in the project folder` \
        --dockerfile "${BUILD_CONTEXT}/Dockerfile" \
        --no-push \
        ${VARIANT+--build-arg VARIANT=$VARIANT} \
        ${REGISTRY_MIRROR+--build-arg REGISTRY_MIRROR=$REGISTRY_MIRROR} \
        ${REGISTRY_MIRROR_LIB+--build-arg REGISTRY_MIRROR_LIB=$REGISTRY_MIRROR_LIB} \
        --build-arg IMAGE_BUILD_VERSION=$IMAGE_BUILD_VERSION \
        --build-arg IMAGE_BUILD_SHA=$CI_COMMIT_SHORT_SHA \
        $destination_args \
        --cache=true \
        --cache-repo=$CI_REGISTRY_IMAGE/$IMAGE_NAME${VARIANT+-$VARIANT}/kaniko-cache \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.version=${tag}"
    # step 2: scan the image
    - |
      # make sure there is a tmp directory for trivy
      mkdir -p /tmp
      # Build report
      trivy image --ignorefile $IMAGE_DIR/.trivyignore --exit-code 0 --cache-dir $CI_PROJECT_DIR/.cache/trivy --no-progress --format json -o scanning-report-$IMAGE_NAME${VARIANT+-$VARIANT}.json --input $IMAGE_NAME${VARIANT+-$VARIANT}.tar
      # Print report
      trivy image --ignorefile $IMAGE_DIR/.trivyignore --exit-code 0 --cache-dir $CI_PROJECT_DIR/.cache/trivy --no-progress --severity HIGH,CRITICAL --input $IMAGE_NAME${VARIANT+-$VARIANT}.tar
      # Report severe vulnerabilities for non MRs
      # fail only on non MRs
      if [ -z "$CI_MERGE_REQUEST_IID" ]; then
        set +e
      fi
      trivy image --ignorefile $IMAGE_DIR/.trivyignore --exit-code 1 --cache-dir $CI_PROJECT_DIR/.cache/trivy --severity CRITICAL --no-progress --input $IMAGE_NAME${VARIANT+-$VARIANT}.tar
      TRIVY_EXIT_CODE=$?
      set -e
    # step 3: upload the image
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - |
      for tag in $CI_COMMIT_SHA $EXTRA_TAGS
      do
        crane push "$IMAGE_NAME${VARIANT+-$VARIANT}.tar" "$CI_REGISTRY_IMAGE/$IMAGE_NAME${VARIANT+-$VARIANT}:$tag"
      done
      exit $TRIVY_EXIT_CODE
  artifacts:
    when: always
    name: "scan-report"
    paths:
      - scanning-report-$IMAGE_NAME${VARIANT+-$VARIANT}.json
  rules:
    - if: $CI_MERGE_REQUEST_IID
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        EXTRA_TAGS: $CI_DEFAULT_BRANCH-$CI_COMMIT_SHA latest
    - if: $CI_COMMIT_TAG
      variables:
        EXTRA_TAGS: $CI_COMMIT_TAG
    - when: on_success
