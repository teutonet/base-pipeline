.default_rules: &default_rules
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    variables:
      EXTRA_TAGS: $CI_DEFAULT_BRANCH-$CI_COMMIT_SHA latest
  - if: $CI_COMMIT_TAG
    variables:
      EXTRA_TAGS: $CI_COMMIT_TAG
  - when: on_success

.build:
  stage: build
  parallel:
    matrix:
      - IMAGE_DIR:
          - $CI_PROJECT_DIR
        IMAGE_NAME:
          - $CI_PROJECT_NAME

variables:
  PIPELINE_IMAGE_VERSION: latest

fetch-version:
  image: ${REGISTRY_MIRROR}bitnamilegacy/git:2.42.0-debian-11-r41
  stage: build
  variables:
    GIT_DEPTH: "0"
  script:
    - echo IMAGE_BUILD_VERSION="`git describe --tags --abbrev=0`" > version-var.env
  artifacts:
    reports:
      dotenv: version-var.env
  rules:
    - *default_rules

build-scan-push:
  extends: .build
  image:
    name: tickets.teuto.net:5050/teuto-public/base-pipeline/kaniko-trivy:$PIPELINE_IMAGE_VERSION
    entrypoint: [""]
  cache:
    paths: [.cache/trivy]
    key: vulndb
  needs:
    - fetch-version
  script:
    - |
      if [ -z "$IMAGE_DIR" ] && [ "$IMAGE_NAME" != "$CI_PROJECT_NAME" ]; then
        IMAGE_DIR=$IMAGE_NAME
      fi
    - |
      # run before-build-scan-push script if present
      cd $IMAGE_DIR

      SCRIPT_FILE_NAME="before-build-scan-push"

      if [ -f "$SCRIPT_FILE_NAME" ]; then
        echo "execute located script before-build-scan-push: $IMAGE_DIR/$SCRIPT_FILE_NAME"
        sh -x $SCRIPT_FILE_NAME
        if [ $? -ne 0 ]; then
          echo "error while executing before-build-scan-push"
          exit 1
        fi
      else
        echo "no before-build scan push script found: $IMAGE_DIR/$SCRIPT_FILE_NAME"
      fi

      cd $CI_PROJECT_DIR
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        EXTRA_TAGS="$CI_DEFAULT_BRANCH-$CI_COMMIT_SHA latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        EXTRA_TAGS="$CI_COMMIT_TAG"
      fi
      ALL_TAGS="$CI_COMMIT_SHA $EXTRA_TAGS"
      NAME_WITH_VARIANT="$IMAGE_NAME${VARIANT+-$VARIANT}"
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - |
      destination_args="--tar-path=$NAME_WITH_VARIANT.tar"
      for tag in $ALL_TAGS
      do
        destination_args="$destination_args --destination $CI_REGISTRY_IMAGE/$NAME_WITH_VARIANT:$tag"
      done

      BUILD_CONTEXT=${IMAGE_DIR}
    # step 0: if MR and image+pipeline unchanged, just re-tag it and exit
    - |
      if [[ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]]
      then
        git config --add safe.directory $CI_PROJECT_DIR
        git worktree remove .git/worktree/merge-base || true
        git worktree add .git/worktree/merge-base $CI_MERGE_REQUEST_DIFF_BASE_SHA

        if diff -qr "$BUILD_CONTEXT" ".git/worktree/merge-base/$BUILD_CONTEXT" &> /dev/null && diff -qr "$CI_CONFIG_PATH" ".git/worktree/merge-base/$CI_CONFIG_PATH" &> /dev/null
        then
          echo "No changes for $BUILD_CONTEXT in this MR"

          RETAG_FAILED=0

          for tag in $ALL_TAGS
          do
            s=10
            until crane tag "$CI_REGISTRY_IMAGE/$NAME_WITH_VARIANT:$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$tag"
            do
              if [[ $s -gt 100 ]]
              then
                RETAG_FAILED=1
                break 2
              fi
              sleep $s
              s=$(( s * 2 ))
            done
          done

          if [ "$RETAG_FAILED" == "0" ]
          then
            exit 0
          fi
        fi
      fi
    # step 1: build the image
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

    - echo "build image with name '$IMAGE_NAME' in directory '$BUILD_CONTEXT'"

    - |
      /kaniko/executor \
        --registry-mirror mirror.gcr.io \
        --context tar://<(cd "$BUILD_CONTEXT" && tar chmz .) \
        `# '--dockerfile' must be set because kaniko only uses the dockerfile from '--context' if none exists in the project folder` \
        --dockerfile "${BUILD_CONTEXT}/Dockerfile" \
        --no-push \
        ${VARIANT+--build-arg VARIANT=$VARIANT} \
        ${REGISTRY_MIRROR+--build-arg REGISTRY_MIRROR=$REGISTRY_MIRROR} \
        ${REGISTRY_MIRROR_LIB+--build-arg REGISTRY_MIRROR_LIB=$REGISTRY_MIRROR_LIB} \
        --build-arg IMAGE_BUILD_VERSION=$IMAGE_BUILD_VERSION \
        --build-arg IMAGE_BUILD_SHA=$CI_COMMIT_SHORT_SHA \
        $destination_args \
        --cache=true \
        --cache-repo=$CI_REGISTRY_IMAGE/$NAME_WITH_VARIANT/kaniko-cache \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.version=${tag}"
    # step 2: scan the image
    - |
      # make sure there is a tmp directory for trivy
      mkdir -p /tmp
      # define default trivy options
      TRIVY_OPTIONS="\
        --db-repository mirror.teuto.net/ghcr.io/aquasecurity/trivy-db:2 \
        --java-db-repository mirror.teuto.net/ghcr.io/aquasecurity/trivy-java-db:1 \
        --cache-dir $CI_PROJECT_DIR/.cache/trivy \
        --no-progress"
      if [ -f "$IMAGE_DIR/.trivyignore" ]
      then
        TRIVY_OPTIONS="$TRIVY_OPTIONS --ignorefile $IMAGE_DIR/.trivyignore"
      fi
      # Build report
      trivy image $TRIVY_OPTIONS --exit-code 0 --format json -o scanning-report-$NAME_WITH_VARIANT.json --input $NAME_WITH_VARIANT.tar
      # Create SBOM
      syft scan docker-archive:./$NAME_WITH_VARIANT.tar -o cyclonedx-json=sbom-$NAME_WITH_VARIANT.json
      # Print report
      trivy image $TRIVY_OPTIONS --exit-code 0 --severity HIGH,CRITICAL --input $NAME_WITH_VARIANT.tar
      # Report severe vulnerabilities for non MRs
      # fail only on non MRs
      if [ -z "$CI_MERGE_REQUEST_IID" ]; then
        trivy image $TRIVY_OPTIONS --exit-code 1 --severity CRITICAL --input $NAME_WITH_VARIANT.tar
      fi
    # step 3: upload the image
    - |
      for tag in $ALL_TAGS
      do
        crane push "$NAME_WITH_VARIANT.tar" "$CI_REGISTRY_IMAGE/$NAME_WITH_VARIANT:$tag"
      done

  artifacts:
    when: always
    name: "scan-report"
    paths:
      - scanning-report-$IMAGE_NAME${VARIANT+-$VARIANT}.json
      - sbom-$IMAGE_NAME${VARIANT+-$VARIANT}.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        EXTRA_TAGS: $CI_DEFAULT_BRANCH-$CI_COMMIT_SHA latest
    - if: $CI_COMMIT_TAG
      variables:
        EXTRA_TAGS: $CI_COMMIT_TAG
    - when: on_success

scan-project:
  stage: build
  image:
    name: tickets.teuto.net:5050/teuto-public/base-pipeline/kaniko-trivy:$PIPELINE_IMAGE_VERSION
    entrypoint: [""]
  needs: []
  script:
    - |
      syft scan dir:. -o cyclonedx-json=sbom-root.json
  artifacts:
    name: "scan-report"
    paths:
      - sbom-root.json
  rules:
    - *default_rules

upload-boms:
  stage: build
  needs:
    - job: build-scan-push
      artifacts: true
    - job: scan-project
      artifacts: true
  image: registry.gitlab.com/gitlab-ci-utils/curl-jq:4.0.2
  script:
    - |
      function create_or_get_project() {
        VERSION="$1"
        CREATE_EXTRA_JSON="$2"

        set +e
        PROJECT_UUID=`curl --fail -s "$DTRACK_API/v1/project/lookup?name=$CI_PROJECT_NAME&version=$VERSION" --header "X-Api-Key: $DTRACK_KEY" | jq -r '.uuid'`
        set -e

        if [ -z "$PROJECT_UUID" ]
        then
          PROJECT_UUID=`curl --fail -s -X PUT "$DTRACK_API/v1/project" --json "{\"name\": \"$CI_PROJECT_NAME\", \"version\": \"$VERSION\" ${CREATE_EXTRA_JSON}}" --header "X-Api-Key: $DTRACK_KEY" | jq -r '.uuid'`
        fi

        echo "$PROJECT_UUID"
      }
    - |
    
      if [ -z "$DTRACK_API" ]; then
        echo "Dependency-Track integration is disabled"
      else
        if [ -z "$DTRACK_KEY" ]; then
          echo "WARNING: DTRACK_API set but DTRACK_KEY not set, Dependency-Track integration is disabled"
        else
          echo "Dependency-Track integration"
          echo "creating project(s)"
          if [ -n "$CI_COMMIT_TAG" ]; then
            PROJECT_UUID=`create_or_get_project production ", \"collectionLogic\": \"AGGREGATE_DIRECT_CHILDREN\""`
            DTRACK_PROJECT_VERSION=production
          else
            if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
              PROJECT_UUID=`create_or_get_project staging ", \"collectionLogic\": \"AGGREGATE_DIRECT_CHILDREN\""`
              DTRACK_PROJECT_VERSION=staging
            else
              FEATURE_PROJECT_UUID="`create_or_get_project feature`"
              PROJECT_UUID=`create_or_get_project "$CI_COMMIT_SHA" ", \"parent\": {\"uuid\": \"$FEATURE_PROJECT_UUID\"}, \"collectionLogic\": \"AGGREGATE_DIRECT_CHILDREN\""`
              DTRACK_PROJECT_VERSION="$CI_COMMIT_SHA"
            fi
          fi

          echo "view the project at: ${DTRACK_API%/api}/projects/$PROJECT_UUID"
          
          for SBOM_FILE in $(find . -maxdepth 1 -name "sbom-*.json")
          do
            NAME_WITH_VARIANT="${SBOM_FILE%.json}"
            NAME_WITH_VARIANT="${NAME_WITH_VARIANT#./}"
            NAME_WITH_VARIANT="${NAME_WITH_VARIANT#sbom-}"
            echo "uploading bom for $NAME_WITH_VARIANT"
            curl -s --location --request POST $DTRACK_API/v1/bom \
              --header "X-Api-Key: $DTRACK_KEY" \
              --header "Content-Type: multipart/form-data" \
              --form "autoCreate=true" \
              --form "projectName=$CI_PROJECT_NAME/$NAME_WITH_VARIANT" \
              --form "projectVersion=$DTRACK_PROJECT_VERSION" \
              --form "parentName=$CI_PROJECT_NAME" \
              --form "parentVersion=$DTRACK_PROJECT_VERSION" \
              --form "bom=@$SBOM_FILE"
          done

        fi
      fi

vulnerability-guard:
  stage: build
  needs:
    - job: build-scan-push
      artifacts: true
  image: ${REGISTRY_MIRROR}badouralix/curl-jq:alpine@sha256:a627689c72d87ace6c7f276d0971c6c3200d93b7ba18b88e002ada7ae62bc105
  script:
    - | 
        FAIL=0
        for report in $(find . -maxdepth 1 -name "scanning-report-*.json")
        do
          echo -n "checking $report ..."
          RESULT=$(cat "$report" | jq -e '[.Results[]?.Vulnerabilities[]?.Severity] | contains(["CRITICAL"]) | not')
          if [ "$RESULT" = "true" ]; then
            echo " ✅"
          else
            echo " ❌"
            FAIL=1
          fi
        done
        if [ "$FAIL" -eq 1 ]; then
          echo "critical CVEs found, failing!"
          exit 1
        fi
  rules:
    - if: $CI_MERGE_REQUEST_IID
      allow_failure: true
